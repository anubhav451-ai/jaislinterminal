# Render Blueprint: New -> Blueprint -> pick this repo.
# The Angel One keys are secrets: fill them in the Render dashboard (they are never stored in this file).
# Note: Angel One checks the IP your server uses. Render's free plan has no fixed IP of its own.
services:
  - type: web
    name: nifty50-terminal
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
